<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Placement Prediction System{% endblock %}</title>

    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

    {% block head %}{% endblock %}
</head>
<body>

    <!-- Navigation Header -->
    <header>
        <div class="logo">
            Placement Prediction System
        </div>
        <nav>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="#">Predict</a>
            <a href="#">About</a>
        </nav>
    </header>

    <!-- Dynamic Content Area -->
    <main>
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
